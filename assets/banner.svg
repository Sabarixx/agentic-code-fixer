<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap');

      * { box-sizing: border-box; }

      .font-display {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .font-mono {
        font-family: 'Fira Code', monospace;
      }

      /* Core Keyframe Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.3deg); }
      }

      @keyframes pulseGlowCyan {
        0%, 100% { opacity: 0.35; filter: blur(70px); }
        50% { opacity: 0.65; filter: blur(95px); }
      }

      @keyframes pulseGlowPurple {
        0%, 100% { opacity: 0.3; filter: blur(80px); }
        50% { opacity: 0.55; filter: blur(100px); }
      }

      @keyframes liveTraceFlow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; }
      }

      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes terminalBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes tagShimmer {
        0%, 100% { border-color: rgba(46, 196, 182, 0.3); }
        50% { border-color: rgba(94, 234, 212, 0.8); }
      }

      .float-anim {
        animation: floatSlow 7s ease-in-out infinite;
      }

      .glow-cyan {
        animation: pulseGlowCyan 6s ease-in-out infinite;
        transform-origin: center;
      }

      .glow-purple {
        animation: pulseGlowPurple 8s ease-in-out infinite;
        transform-origin: center;
      }

      .trace-flow {
        stroke-dasharray: 12 8;
        animation: liveTraceFlow 3.5s linear infinite;
      }

      .trace-flow-rev {
        stroke-dasharray: 10 6;
        animation: liveTraceFlow 4s linear infinite reverse;
      }

      .live-cursor {
        animation: terminalBlink 1s infinite;
      }

      .node-pulse-1 { animation: nodePulse 3s ease-in-out infinite; transform-origin: center; }
      .node-pulse-2 { animation: nodePulse 3s ease-in-out infinite 1s; transform-origin: center; }
      .node-pulse-3 { animation: nodePulse 3s ease-in-out infinite 2s; transform-origin: center; }
    </style>

    <!-- Deep Cyber/Obsidian Gradients -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080b" />
      <stop offset="40%" stop-color="#080f14" />
      <stop offset="80%" stop-color="#0c1820" />
      <stop offset="100%" stop-color="#060b0e" />
    </linearGradient>

    <!-- Vibrant Brand Gradients -->
    <linearGradient id="neonTealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="40%" stop-color="#14b8a6" />
      <stop offset="80%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="cyberAmberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="violetIndigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101d24" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#070c10" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="borderGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glassmorphism Dropshadow -->
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14b8a6" flood-opacity="0.15" />
    </filter>

    <!-- Hexagon Isometric Pattern -->
    <pattern id="hexGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.028)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(45, 212, 191, 0.25)" />
    </pattern>

    <!-- Dot Matrix -->
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="rgba(255, 255, 255, 0.07)" />
    </pattern>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1280" height="500" rx="24" fill="url(#cyberBg)" />
  <rect width="1280" height="500" rx="24" fill="url(#hexGrid)" />

  <!-- Ambient Light Orbs -->
  <circle class="glow-cyan" cx="260" cy="180" r="180" fill="#0f766e" />
  <circle class="glow-purple" cx="1080" cy="320" r="210" fill="#581c87" />
  <circle class="glow-cyan" cx="720" cy="420" r="140" fill="#0369a1" opacity="0.4" />

  <!-- Abstract LangGraph Node Topology in Background -->
  <g stroke="rgba(45, 212, 191, 0.18)" stroke-width="1.5" fill="none">
    <!-- Curved Pipeline Synapses -->
    <path d="M 60 220 Q 200 120 380 220 T 700 220" class="trace-flow" />
    <path d="M 580 80 Q 750 40 920 120 T 1220 100" class="trace-flow-rev" />
    <path d="M 150 420 Q 320 460 500 380" stroke="rgba(139, 92, 246, 0.25)" class="trace-flow" />
  </g>

  <!-- ==================== LEFT HERO CONTENT ==================== -->
  <g transform="translate(75, 52)">

    <!-- Top Futuristic Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="255" height="34" rx="17" fill="rgba(15, 23, 42, 0.8)" stroke="url(#borderGlowGrad)" stroke-width="1.2" />
      <!-- Animated Pulsing Beacon Icon -->
      <circle cx="18" cy="17" r="4" fill="#2dd4bf" />
      <circle class="node-pulse-1" cx="18" cy="17" r="8" fill="none" stroke="#2dd4bf" stroke-width="1.2" />
      <text x="34" y="22" class="font-mono" font-size="11.5" font-weight="700" fill="#a7f3d0" letter-spacing="1.8">AUTONOMOUS MULTI-AGENT</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" class="font-display" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
        AGENTIC CODE FIXER
      </text>
      <!-- Subtitle with Glowing Cyber Gradient -->
      <text x="0" y="46" class="font-display" font-size="33" font-weight="800" fill="url(#neonTealGrad)" letter-spacing="-0.8">
        Closed-Loop Self-Healing Engine
      </text>
    </g>

    <!-- Descriptive Pitch -->
    <g transform="translate(0, 192)">
      <text x="0" y="0" class="font-display" font-size="15.5" font-weight="500" fill="#94a3b8" letter-spacing="0.1">
        Turns broken code &amp; failing assertions into verified, narrow patches.
      </text>
      <text x="0" y="24" class="font-display" font-size="15.5" font-weight="500" fill="#94a3b8" letter-spacing="0.1">
        AST invariant localization · Isolated sandbox · Zero hallucinations.
      </text>
    </g>

    <!-- Architecture Capability Badges (Glassmorphic) -->
    <g transform="translate(0, 272)">
      
      <!-- Badge 1: LangGraph State Machine -->
      <g transform="translate(0, 0)">
        <rect width="168" height="42" rx="12" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.45)" stroke-width="1.2" />
        <!-- Topology Node Icon -->
        <circle cx="22" cy="21" r="5" fill="none" stroke="#a78bfa" stroke-width="2" />
        <circle cx="22" cy="21" r="2" fill="#c084fc" />
        <line x1="27" y1="21" x2="33" y2="21" stroke="#a78bfa" stroke-width="1.8" />
        <circle cx="36" cy="21" r="3" fill="#a78bfa" />
        <text x="48" y="26" class="font-mono" font-size="12" font-weight="600" fill="#ddd6fe">LangGraph v2</text>
      </g>

      <!-- Badge 2: 100% Sandbox Verified -->
      <g transform="translate(180, 0)">
        <rect width="162" height="42" rx="12" fill="rgba(45, 212, 191, 0.12)" stroke="rgba(45, 212, 191, 0.45)" stroke-width="1.2" />
        <!-- Shield Verification Icon -->
        <path d="M 18 14 L 26 10 L 34 14 L 34 22 C 34 27 26 31 26 31 C 26 31 18 27 18 22 Z" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M 22 20 L 25 23 L 30 17" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <text x="44" y="26" class="font-mono" font-size="12" font-weight="600" fill="#5eead4">100% Verified</text>
      </g>

      <!-- Badge 3: Bayesian Confidence Score -->
      <g transform="translate(354, 0)">
        <rect width="152" height="42" rx="12" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1.2" />
        <!-- Gauge/Dial Icon -->
        <circle cx="22" cy="21" r="8" fill="none" stroke="#fbbf24" stroke-width="1.8" />
        <line x1="22" y1="21" x2="27" y2="16" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
        <text x="38" y="26" class="font-mono" font-size="12" font-weight="600" fill="#fde68a">0.98 Conf</text>
      </g>
    </g>

    <!-- Metric Counter Line -->
    <g transform="translate(0, 348)">
      <text x="0" y="0" class="font-mono" font-size="12.5" font-weight="600" fill="#64748b">
        <tspan fill="#2dd4bf">40/40</tspan> SUITES PASSED  •  <tspan fill="#f59e0b">&lt; 1.2s</tspan> LATENCY  •  <tspan fill="#a78bfa">0</tspan> REGRESSIONS
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT FLOATING IDE TERMINAL ==================== -->
  <g class="float-anim" transform="translate(685, 42)" filter="url(#glassShadow)">
    <!-- Terminal Outer Frame -->
    <rect width="520" height="415" rx="18" fill="url(#glassCardGrad)" stroke="url(#borderGlowGrad)" stroke-width="1.5" />
    
    <!-- Header Bar -->
    <path d="M 0 18 A 18 18 0 0 1 18 0 L 502 0 A 18 18 0 0 1 520 18 L 520 44 L 0 44 Z" fill="#0d171d" />
    <line x1="0" y1="44" x2="520" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="24" cy="22" r="5.5" fill="#f43f5e" />
    <circle cx="42" cy="22" r="5.5" fill="#fbbf24" />
    <circle cx="60" cy="22" r="5.5" fill="#10b981" />

    <!-- Active File Tab -->
    <g transform="translate(85, 8)">
      <rect width="180" height="28" rx="6" fill="#13232c" stroke="rgba(45, 212, 191, 0.25)" stroke-width="1" />
      <!-- Python Icon / Sparkle -->
      <circle cx="16" cy="14" r="3.5" fill="#2dd4bf" />
      <text x="28" y="19" class="font-mono" font-size="11.5" font-weight="500" fill="#e2e8f0">repair_graph.py</text>
    </g>

    <!-- Status Badge in Titlebar -->
    <g transform="translate(424, 11)">
      <rect width="78" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
      <text x="39" y="15.5" text-anchor="middle" class="font-mono" font-size="10" font-weight="700" fill="#34d399">EXEC LIVE</text>
    </g>

    <!-- Terminal Body: Live Multi-Agent Log Stream -->
    <g transform="translate(26, 68)" class="font-mono" font-size="12">
      
      <!-- Stage 01: Test Failure Invariant -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#64748b">[0.00s] &gt; pytest specs/test_metrics.py</text>
        <rect x="-4" y="24" width="476" height="24" rx="5" fill="rgba(244, 63, 94, 0.12)" />
        <text x="6" y="41" fill="#fb7185" font-weight="600">✖ FAIL: ZeroDivisionError at metrics.py:42</text>
      </g>

      <!-- Stage 02: AST Diagnostics -->
      <g transform="translate(0, 64)">
        <text x="0" y="14" fill="#a78bfa">⚡ [PLANNER] AST invariant breach detected</text>
        <text x="0" y="32" fill="#94a3b8">  ↳ Hypotheses: Unchecked zero-denominator divisor</text>
      </g>

      <!-- Stage 03: Surgical Patch Synthesized -->
      <g transform="translate(0, 118)">
        <text x="0" y="14" fill="#38bdf8">🔨 [CODER] Synthesizing minimal AST patch...</text>
        <!-- Diff Box -->
        <rect x="-4" y="24" width="476" height="52" rx="7" fill="#061217" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1" />
        <text x="8" y="43" fill="#f87171">- return total_score / total_submissions</text>
        <text x="8" y="63" fill="#2dd4bf" font-weight="700">+ if total_submissions == 0: return 0.0</text>
      </g>

      <!-- Stage 04: Isolated Sandbox Verification -->
      <g transform="translate(0, 204)">
        <text x="0" y="14" fill="#fbbf24">⏳ [SANDBOX] Running 40 test contracts in container...</text>
        <rect x="-4" y="24" width="476" height="24" rx="5" fill="rgba(16, 185, 129, 0.15)" />
        <text x="6" y="41" fill="#34d399" font-weight="700">✔ 40/40 PASSED in 0.36s (100% Assertion Coverage)</text>
      </g>

      <!-- Stage 05: Cryptographic Receipt Emitted -->
      <g transform="translate(0, 276)">
        <rect x="-4" y="0" width="476" height="34" rx="8" fill="rgba(45, 212, 191, 0.08)" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1" />
        <text x="8" y="22" fill="#5eead4" font-weight="700">★ PROOF RECEIPT: 0x7f9a... [CONFIDENCE: 0.98]</text>
        <text x="440" y="22" class="live-cursor" fill="#2dd4bf" font-weight="900">█</text>
      </g>

    </g>
  </g>

  <!-- Bottom Accent Gradient Blade -->
  <line x1="30" y1="499" x2="1250" y2="499" stroke="url(#borderGlowGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
</svg>
